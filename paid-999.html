<!DOCTYPE html>
<html>
<head>
  <title>Payment Confirmed – GFI Flow Intelligence</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0b1220;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #0d1526;
      max-width: 760px;
      margin: 40px 20px;
      padding: 60px 50px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
    }
    .logo {
      margin-bottom: 32px;
      display: block;
    }
    .logo img {
      height: 50px;
      width: auto;
    }
    .checkmark {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(159,232,112,0.12);
      border: 2px solid rgba(159,232,112,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
      color: #9FE870;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      color: #f8fbff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .sub {
      font-size: 18px;
      color: #9fb0c8;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 32px 0;
    }
    .btn {
      display: inline-block;
      background: #9FE870;
      color: #0b1220;
      padding: 16px 36px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
      border-radius: 8px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #8fd460;
    }
    .info-text {
      color: #6b7a8f;
      font-size: 15px;
      margin-top: 20px;
      line-height: 1.7;
    }
    .info-text a {
      color: #7DD3FC;
      text-decoration: none;
    }
    .info-text a:hover {
      text-decoration: underline;
    }
    .wechat-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }
    .wechat-footer img {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 2px;
      background: #fff;
    }
    .wechat-footer span {
      font-size: 12px;
      color: #6b7a8f;
      letter-spacing: 0.03em;
      font-weight: 400;
    }
    .footer-bottom {
      color: #3d4a5e;
      font-size: 12px;
      margin-top: 20px;
      text-align: center;
    }
    @media (max-width: 600px) {
      .container { padding: 40px 24px; }
      h1 { font-size: 26px; }
      .sub { font-size: 16px; }
      .btn { padding: 14px 28px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="https://gfiintel.com/GFILOGO.png" alt="GFI Flow Intelligence">
  </div>

  <div class="checkmark">✓</div>

  <h1>Payment Confirmed</h1>
  <p class="sub">Your Executive Structural Risk Diagnostic has been initiated.</p>

  <hr class="divider">

  <a href="YOUR_GOOGLE_FORM_LINK_HERE" class="btn">
    Submit Diagnostic Information →
  </a>

  <p class="info-text">
    Delivery timeline: <strong style="color:#f8fbff;">48 hours</strong> from completed submission.
  </p>

  <hr class="divider">

  <div class="wechat-footer">
    <img src="wechat-qr-pingxu.jpg" alt="WeChat QR">
    <span>WeChat ID: wxid_e1ugnreimr6m22</span>
  </div>

  <p class="info-text" style="margin-top:16px;">
    Questions? <a href="mailto:gfi@gfiintel.com">gfi@gfiintel.com</a>
  </p>
</div>

<div class="footer-bottom">
  © 2026 GFI Flow Intelligence · Boston
</div>

</body>
</html>
