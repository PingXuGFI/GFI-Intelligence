<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFI Flow Intelligence</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #0b1c2c, #1f4b7a);
  color: white;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 20px;
}
.lang-switch {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 14px;
}
.lang-switch span {
  margin-left: 10px;
  cursor: pointer;
  opacity: 0.7;
}
.lang-switch span:hover {
  opacity: 1;
}
.label { font-size: 12px; letter-spacing: 1.5px; color: #9fb3c8; margin-bottom: 20px;}
h1 { font-size: 42px; line-height: 1.3; margin-bottom: 20px;}
p { color: #c9d6e2; font-size: 16px; margin-bottom: 40px;}
.btn {
  display: inline-block;
  padding: 14px 22px;
  border: 1px solid #c9d6e2;
  border-radius: 6px;
  text-decoration: none;
  color: white;
}
footer {
  margin-top: 100px;
  font-size: 12px;
  color: #9fb3c8;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 20px;
}
</style>
</head>

<body>

<div class="lang-switch">
  <span onclick="setLang('en')">EN</span>
  <span onclick="setLang('tw')">繁</span>
  <span onclick="setLang('cn')">简</span>
  <span onclick="setLang('es')">ES</span>
</div>

<div class="container">

<div class="label" id="label"></div>
<h1 id="title"></h1>
<p id="desc"></p>

<a href="procurement-insert.pdf" target="_blank" class="btn" id="btn"></a>

<footer>
© 2026 GFI Flow Intelligence · Boston · 
<a href="https://papers.ssrn.com" target="_blank" style="color:#9fb3c8;">SSRN</a> · 
ping@gfiintel.com
</footer>

</div>

<script>
const content = {
  en: {
    label: "FOR PROCUREMENT OFFICERS & VENDORS",
    title: "Add a 90-Day Outcome Verification Requirement to Your RFP",
    desc: "One-page procurement insert. Copy directly into your contract.",
    btn: "GET PROCUREMENT INSERT →"
  },
  tw: {
    label: "適用於採購單位與廠商",
    title: "將90天成果驗證納入RFP標準",
    desc: "一頁式採購條款，可直接納入合約。",
    btn: "下載採購條款 →"
  },
  cn: {
    label: "适用于采购单位与厂商",
    title: "将90天成果验证纳入RFP标准",
    desc: "一页式采购条款，可直接纳入合同。",
    btn: "下载采购条款 →"
  },
  es: {
    label: "PARA OFICIALES DE CONTRATACIÓN Y PROVEEDORES",
    title: "Agregue verificación de resultados a 90 días a su RFP",
    desc: "Inserto de una página. Copie directamente en su contrato.",
    btn: "DESCARGAR →"
  }
};

function setLang(lang) {
  document.getElementById("label").innerText = content[lang].label;
  document.getElementById("title").innerText = content[lang].title;
  document.getElementById("desc").innerText = content[lang].desc;
  document.getElementById("btn").innerText = content[lang].btn;
  localStorage.setItem("lang", lang);
}

const saved = localStorage.getItem("lang") || "en";
setLang(saved);
</script>

</body>
</html>
